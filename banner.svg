<svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bin { fill:#1f3d2e; font-family:'Courier New', monospace; font-size:13px; }
      .name { fill:#39ff88; font-family:'Courier New', monospace; font-weight:bold; font-size:80px; filter:url(#glow); }
      .tag { fill:#39ff88; font-family:'Courier New', monospace; font-size:18px; letter-spacing:2px; }
      .cmd { fill:#7fffb0; font-family:'Courier New', monospace; font-size:15px; }
      .border { fill:none; stroke:#39ff88; stroke-width:1.5; opacity:0.6; }
      .cursor { fill:#39ff88; }
    </style>
  </defs>

  <rect width="900" height="340" fill="#0d1117"/>
  <rect x="20" y="20" width="860" height="300" class="border"/>

  <!-- scattered binary background -->
  <text x="45" y="55" class="bin">10110</text>
  <text x="45" y="80" class="bin">01A3F</text>
  <text x="45" y="105" class="bin">2D3E1</text>
  <text x="45" y="290" class="bin">7B449</text>
  <text x="45" y="270" class="bin">19C4A</text>
  <text x="45" y="250" class="bin">8B71D</text>
  <text x="800" y="55" class="bin">E8B2E</text>
  <text x="800" y="80" class="bin">1B44F</text>
  <text x="800" y="290" class="bin">3E17A</text>
  <text x="800" y="270" class="bin">9F62E</text>
  <text x="800" y="105" class="bin">09FDA</text>

  <!-- glowing pulsing name -->
  <text x="450" y="150" text-anchor="middle" class="name">
    NIKHIL
    <animate attributeName="opacity" values="1;0.55;1" dur="1.8s" repeatCount="indefinite" />
  </text>

  <!-- blinking cursor -->
  <rect x="640" y="115" width="14" height="55" class="cursor">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" />
  </rect>

  <!-- tagline -->
  <text x="450" y="200" text-anchor="middle" class="tag">CSE &#8226; FULL STACK DEV &#8226; BATCH 2024-2028</text>

  <!-- command line -->
  <text x="450" y="240" text-anchor="middle" class="cmd">~/nikhil git push origin main --force</text>
</svg>
