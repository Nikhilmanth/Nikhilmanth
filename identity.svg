<svg width="900" height="330" viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .card { fill:#0f1620; stroke:#233; stroke-width:1; }
      .label { fill:#e6edf3; font-family:'Courier New', monospace; font-weight:bold; font-size:16px; }
      .value { fill:#9fb0bf; font-family:'Courier New', monospace; font-size:15px; }
      .code  { fill:#7fffb0; font-family:'Courier New', monospace; font-size:14px; }
      .sep   { stroke:#1c2530; stroke-width:1; }
      .accent{ fill:#39ff88; }
    </style>
  </defs>

  <rect x="20" y="10" width="860" height="310" rx="14" class="card"/>

  <!-- rows: y-centers spaced 50px apart starting at 55 -->
  <!-- row 1 -->
  <rect x="20" y="10" width="6" height="50" class="accent"/>
  <text x="55" y="45" class="label">🎓 Education</text>
  <text x="290" y="45" class="value">CSE · Full Stack Dev · (your college name) · Batch 2024-2028</text>
  <line x1="40" y1="60" x2="860" y2="60" class="sep"/>

  <!-- row 2 -->
  <text x="55" y="95" class="label">📍 Location</text>
  <text x="290" y="95" class="value">(your city, state) · IN</text>
  <line x1="40" y1="110" x2="860" y2="110" class="sep"/>

  <!-- row 3 -->
  <text x="55" y="145" class="label">⚡ Status</text>
  <text x="290" y="145" class="value">Building 24/7 — real products, real users, no excuses</text>
  <line x1="40" y1="160" x2="860" y2="160" class="sep"/>

  <!-- row 4 -->
  <text x="55" y="195" class="label">💭 Philosophy</text>
  <text x="290" y="195" font-style="italic" class="value">Build in silence. Ship loudly.</text>
  <line x1="40" y1="210" x2="860" y2="210" class="sep"/>

  <!-- row 5 -->
  <text x="55" y="245" class="label">🎯 2028 Goal</text>
  <text x="290" y="245" class="value">Ship → Get Users → Iterate → Repeat</text>
  <line x1="40" y1="260" x2="860" y2="260" class="sep"/>

  <!-- row 6 -->
  <text x="55" y="295" class="label">🧪 Fuel</text>
  <text x="290" y="295" class="code">while(true) { drink(); code(); ship(); }</text>
</svg>
