<svg width="900" height="270" viewBox="0 0 900 270" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .card    { fill:#0f1620; stroke:#233; stroke-width:1; }
      .title   { fill:#9fb0bf; font-family:'Courier New', monospace; font-size:13px; letter-spacing:1px; }
      .colhead { fill:#6b7885; font-family:'Courier New', monospace; font-size:12px; letter-spacing:1px; }
      .cell    { fill:#e6edf3; font-family:'Courier New', monospace; font-size:14px; }
      .pct     { fill:#39ff88; font-family:'Courier New', monospace; font-size:14px; font-weight:bold; }
      .sep     { stroke:#1c2530; stroke-width:1; }
      .barbg   { fill:#1c2530; }
      .barfill { fill:#e6edf3; }
    </style>
  </defs>

  <rect x="20" y="10" width="860" height="250" rx="14" class="card"/>

  <text x="45" y="40" class="title">SCANNING OPEN PORTS — SKILLS IN PROGRESS</text>
  <line x1="45" y1="55" x2="855" y2="55" class="sep"/>

  <text x="45" y="80" class="colhead">PORT</text>
  <text x="130" y="80" class="colhead">SERVICE</text>
  <text x="330" y="80" class="colhead">TARGET</text>
  <text x="560" y="80" class="colhead">PROGRESS</text>

  <!-- row 1 -->
  <text x="45" y="120" class="cell">[3000]</text>
  <text x="130" y="120" class="cell">frontend-mastery</text>
  <text x="330" y="120" class="cell">React + Next.js</text>
  <rect x="560" y="106" width="180" height="16" rx="3" class="barbg"/>
  <rect x="560" y="106" width="0" height="16" rx="3" class="barfill">
    <animate attributeName="width" from="0" to="144" dur="1.6s" fill="freeze" begin="0.1s"/>
  </rect>
  <text x="755" y="119" class="pct">80%</text>

  <!-- row 2 -->
  <text x="45" y="165" class="cell">[5000]</text>
  <text x="130" y="165" class="cell">backend-apis</text>
  <text x="330" y="165" class="cell">Node + Express</text>
  <rect x="560" y="151" width="180" height="16" rx="3" class="barbg"/>
  <rect x="560" y="151" width="0" height="16" rx="3" class="barfill">
    <animate attributeName="width" from="0" to="126" dur="1.6s" fill="freeze" begin="0.3s"/>
  </rect>
  <text x="755" y="164" class="pct">70%</text>

  <!-- row 3 -->
  <text x="45" y="210" class="cell">[5432]</text>
  <text x="130" y="210" class="cell">databases</text>
  <text x="330" y="210" class="cell">MongoDB + SQL</text>
  <rect x="560" y="196" width="180" height="16" rx="3" class="barbg"/>
  <rect x="560" y="196" width="0" height="16" rx="3" class="barfill">
    <animate attributeName="width" from="0" to="108" dur="1.6s" fill="freeze" begin="0.5s"/>
  </rect>
  <text x="755" y="209" class="pct">60%</text>
</svg>
